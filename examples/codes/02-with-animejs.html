<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anime.js を使った three.js アニメーション</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
      "animejs": "https://unpkg.com/animejs@4.5.0/dist/modules/index.js",
      "animejs/adapters/three": "https://unpkg.com/animejs@4.5.0/dist/modules/adapters/three/index.js"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { animate } from 'animejs';
    import 'animejs/adapters/three';

    // --- three.js の基本セットアップ（両ファイル共通） ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(2, 2, 3);
    scene.add(light);

    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.2, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x818cf8, transparent: true }),
    );
    scene.add(mesh);

    // アニメーションする属性:
    // (1) x: mesh.position.x（X方向への移動）
    // (2) rotateY: mesh.rotation.y（Y軸回転、度数法で指定）
    // (3) opacity: mesh.material.opacity（不透明度の変化）
    animate(mesh, {
      x: [-2, 2], // (1)
      rotateY: 360, // (2)
      opacity: [0.7, 1], // (3)
      duration: 1500,
      loop: true,
      alternate: true,
      ease: 'inOutSine',
    });

    // --- 描画ループ（両ファイル共通） ---
    function renderLoop() {
      requestAnimationFrame(renderLoop);
      renderer.render(scene, camera);
    }
    renderLoop();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
