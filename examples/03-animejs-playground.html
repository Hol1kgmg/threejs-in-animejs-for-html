<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Page</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      width: 320px;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid #999;
      border-radius: 4px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      background: #1B2A4A;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form action="https://www.google.com/search" method="GET">
    <input type="text" name="q" placeholder="Google検索" autofocus>
    <button type="submit">検索</button>
  </form>
</body>
</html>
